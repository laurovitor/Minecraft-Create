org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true

# Mod Info
mod_version = 6.0.11
minecraft_version = 26.3

mod_id = create
mod_name = Create
mod_author = simibubi
mod_description = Technology that empowers the player.
mod_license = Read attached LICENSE.md

# NeoForge
# https://neoforged.net/
neo_version = 26.3.0.89
mdg_version = 2.0.144

# Mappings
# https://parchmentmc.org/docs/getting-started
#
# parchment_minecraft_version being set to "same" will use minecraft_version
# parchment_version set to "none" will disable parchment mappings
# No Parchment release exists for 26.3 yet.
parchment_minecraft_version = same
parchment_version = none

# Registrate
# Local experimental Registrate 26.3 port, published to mavenLocal.
registrate_version = MC26.3-1.6.8+254c351

# Ponder and Catnip
# Built from laurovitor/Minecraft-Ponder branch mc26.3/dev and published to mavenLocal.
ponder_version = 1.0.100000+mc26.3

# Flywheel
# https://maven.createmod.net/dev/engine-room/flywheel/
flywheel_version = 1.0.7
flywheel_version_range = [1.0.0,2.0)

# Just Enough Items
# https://modrinth.com/mod/jei/versions
jei_version = 31.14.0.72

# Curios
# https://modrinth.com/mod/curios/versions
curios_version = 17.0.0-beta.3

# Sodium
# https://modrinth.com/mod/sodium/versions
sodium_version = 0.9.3-beta.1

# CC: Tweaked
# https://modrinth.com/mod/cc-tweaked/versions
cc_tweaked_enable = true
cc_tweaked_version = 1.120.3

# JourneyMap
# https://modrinth.com/mod/journeymap/versions
journeymap_version = 26.3-6.0.10+neoforge
journeymap_api_version = 26.2-2.0.0-SNAPSHOT

# Farmer's Delight
# No 26.2 build exists, so the integration is compiled out.
farmers_delight_enable = false

# Only used by -Pemi runs, built from source for 26.2; see the emi checkout next door.
emi_version = 1.1.24-SNAPSHOT+26.2
